# Preset: 外部依存なし構成。plain_slam_ros2 風 HGO + 自前 GICP + NormalMap (point-to-plane 風)。
pylot_lio:
  ros__parameters:
    preprocessor: "voxel_grid"
    voxel_grid_size_m: 0.3
    map: "normal_map"
    map_voxel_size_m: 0.5
    registration: "plain_gicp"
    registration_max_iterations: 20
    state_estimator: "hgo"
