# Preset: 外部依存ゼロ (plain_gicp) + OpenMP 並列化。
#
# small_gicp が無い環境 (= conda-forge / robostack で small_gicp パッケージが
# 解決できない、 sycl_points や別ターゲットの OS など) でも、 OpenMP さえあれば
# small_gicp 相当のスループットを得られる構成。
#
# 並列化単位: plain_gicp_registration の内側 source 点ループ (per-thread accumulator)。
# Gauss-Newton 反復間は時系列依存のため並列化しない。
#
# 注意:
#   - registration_num_threads は plain_gicp と small_gicp の両方で参照される共通パラメータ。
#   - num_threads = 1 にすると OpenMP 経路を踏まず逐次実行になる (デバッグ時に有用)。
#   - 4 スレッドは一般的なノート PC / Jetson Orin で性能/オーバヘッドのバランスが良い。
#     ハイパースレッド oversubscription を避けるため、 物理コア数を超えない値に。
pylot_lio:
  ros__parameters:
    preprocessor: "voxel_grid"
    voxel_grid_size_m: 0.3

    map: "voxel_map"
    map_voxel_size_m: 0.5
    map_min_points_per_cell: 1

    registration: "plain_gicp"
    registration_max_iterations: 20
    registration_max_correspondence_m: 2.0
    # 並列バックエンド: "omp" (OpenMP) | "tbb" (Intel TBB)。
    # TBB と公平比較するときは plain_gicp_tbb.yaml を使う (この値だけ "tbb" に変えた構成)。
    registration_parallel_backend: "omp"
    # OpenMP 並列度。 物理コア数を上限とすること。
    registration_num_threads: 4
    # Gauss-Newton 停止条件 (並進 / 回転)。 厳しくすると反復回数増、 緩めると早く打ち切る。
    registration_convergence_translation_m: 0.0001
    registration_convergence_rotation_rad: 0.0001
    # Huber ロバスト重み。 残差の Mahalanobis ノルムが huber_threshold を超えると
    # 重みが線形に下がる。 動的物体・葉・反射点が多い屋外なら小さく (例: 0.5) する。
    registration_huber_threshold: 1.0

    state_estimator: "gicp_only"
